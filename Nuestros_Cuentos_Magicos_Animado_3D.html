let currentSpread = 0;
let animFrameId = null;
let particles = [];
let isSpeaking = false;

// Audio flip effect using Web Audio API
function playPageFlipSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const bufferSize = ctx.sampleRate * 0.18;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.05));
    }
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;

    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(1200, ctx.currentTime);
    filter.Q.setValueAtTime(1.5, ctx.currentTime);

    noise.connect(filter);
    filter.connect(ctx.destination);
    noise.start();
  } catch (e) {}
}

function stopNarration() {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
  }
  isSpeaking = false;
  const btn = document.getElementById('btnVoice');
  btn.classList.remove('speaking');
  btn.innerHTML = '🔊 Escuchar cuento';
  document.querySelectorAll('.verse-line').forEach(el => el.classList.remove('highlight'));
}

function toggleNarration() {
  if (isSpeaking) {
    stopNarration();
    return;
  }
  const s = spreads[currentSpread];
  let textToRead = '';
  if (s.type === 'cover' || s.type === 'back_cover') {
    textToRead = s.title + '. ' + s.subtitle;
  } else if (s.type === 'video') {
    textToRead = 'Mi historia hecha canción. Dale clic al video para disfrutar nuestra música.';
  } else {
    textToRead = s.title + '. ' + s.verses.join(' ');
    if (s.authorName) {
      textToRead += '. ' + s.authorRole + ': ' + s.authorName;
    }
  }

  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(textToRead);
    utterance.lang = 'es-ES';
    utterance.rate = 0.92;
    utterance.pitch = 1.12;

    const lines = document.querySelectorAll('.verse-line');
    let lineIdx = 0;

    utterance.onstart = () => {
      isSpeaking = true;
      const btn = document.getElementById('btnVoice');
      btn.classList.add('speaking');
      btn.innerHTML = '⏹️ Detener voz';
      if (lines.length > 0) lines[0].classList.add('highlight');
    };

    utterance.onboundary = () => {
      if (lines.length > 0) {
        lines.forEach(l => l.classList.remove('highlight'));
        lines[lineIdx % lines.length].classList.add('highlight');
        lineIdx++;
      }
    };

    utterance.onend = () => {
      stopNarration();
    };

    window.speechSynthesis.speak(utterance);
  }
}

function goToSpread(index) {
  if (index < 0 || index >= spreads.length) return;
  stopNarration();
  playPageFlipSound();
  currentSpread = index;
  renderSpread();
}

function nextSpread() {
  if (currentSpread < spreads.length - 1) goToSpread(currentSpread + 1);
}

function prevSpread() {
  if (currentSpread > 0) goToSpread(currentSpread - 1);
}

function renderSpread() {
  const book = document.getElementById('bookContainer');
  const s = spreads[currentSpread];
  document.getElementById('progressText').textContent = s.label;
  document.getElementById('btnPrev').disabled = currentSpread === 0;
  document.getElementById('btnNext').disabled = currentSpread === spreads.length - 1;

  if (animFrameId) {
    cancelAnimationFrame(animFrameId);
    animFrameId = null;
  }

  if (s.type === 'cover') {
    book.classList.add('cover-mode');
    book.innerHTML = `
      <div class="cover-full">
        <div class="cover-badge">✨ Colección Infantil Interactiva • 6 Años ✨</div>
        <h1 class="cover-title">🦋 ${s.title} 🏰</h1>
        <p class="cover-subtitle">${s.subtitle}</p>
        <div class="cover-authors">
          ${s.authors.map(a => `<span class="cover-author-chip">✍️ ${a}</span>`).join('')}
        </div>
        <button class="btn-open-book" onclick="nextSpread()">📖 Abrir el libro animado</button>
      </div>
    `;
    return;
  }

  if (s.type === 'back_cover') {
    book.classList.add('cover-mode');
    book.innerHTML = `
      <div class="cover-full" style="background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 50%, #fd79a8 100%);">
        <div class="cover-badge">🌟 Fin del Cuento Animado 🌟</div>
        <h1 class="cover-title">${s.title}</h1>
        <p class="cover-subtitle">${s.subtitle}</p>
        <div style="display:flex; gap:15px; flex-wrap:wrap; justify-content:center;">
          <button class="btn-open-book" onclick="goToSpread(0)">🔄 Volver a leer desde el inicio</button>
          <button class="btn-open-book" style="background:#ff9f43;" onclick="downloadBook()">💾 Descargar Libro HTML</button>
        </div>
      </div>
    `;
    return;
  }

  book.classList.remove('cover-mode');

  if (s.type === 'video') {
    book.innerHTML = `
      <div class="spread">
        <div class="page page-left">
          <div class="page-header">
            <span class="story-badge" style="background:${s.color}">${s.badge}</span>
            <span class="page-num">Pág. 17</span>
          </div>
          <h2 class="story-title" style="color:${s.color}">🎵 ${s.title}</h2>
          <div class="video-frame-box">
            <iframe src="https://www.youtube.com/embed/${s.videoId}?rel=0"
                    title="Mi historia hecha canción"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen></iframe>
          </div>
          <a class="yt-fallback-btn" href="https://youtu.be/${s.videoId}" target="_blank" rel="noopener noreferrer">
            📺 Abrir video directamente en YouTube
          </a>
        </div>
        <div class="page">
          <div class="page-header">
            <span class="story-badge" style="background:#ffa502">🎶 ¡A cantar y bailar!</span>
            <span class="page-num">Pág. 18</span>
          </div>
          <div class="art-frame" onclick="spawnMagicBurst(event)">
            <canvas id="sceneCanvas" class="scene-canvas"></canvas>
            <div class="tap-hint">✨ ¡Toca para lanzar notas musicales!</div>
          </div>
        </div>
      </div>
    `;
    initCanvasAnimation(s.scene);
    return;
  }

  const leftVersesHtml = s.verses.map(v => `<div class="verse-line">${v}</div>`).join('');
  const pageLeftNum = currentSpread * 2 - 1;
  const pageRightNum = currentSpread * 2;

  let rightContentHtml = '';
  if (s.type === 'story_author') {
    rightContentHtml = `
      <div style="display:flex; flex-direction:column; gap:16px; height:100%;">
        <div class="art-frame" style="flex:1;" onclick="spawnMagicBurst(event)">
          <canvas id="sceneCanvas" class="scene-canvas"></canvas>
          <div class="tap-hint">✨ ¡Toca el dibujo mágico!</div>
        </div>
        <div class="author-card">
          <h3>🌟 ${s.authorRole} 🌟</h3>
          <div class="author-name">✍️ ${s.authorName}</div>
        </div>
      </div>
    `;
  } else {
    rightContentHtml = `
      <div class="art-frame" onclick="spawnMagicBurst(event)">
        <canvas id="sceneCanvas" class="scene-canvas"></canvas>
        <div class="tap-hint">✨ ¡Toca para magia de colores!</div>
      </div>
    `;
  }

  book.innerHTML = `
    <div class="spread">
      <div class="page page-left">
        <div class="page-header">
          <span class="story-badge" style="background:${s.color}">${s.badge}</span>
          <span class="page-num">Pág. ${pageLeftNum}</span>
        </div>
        <h2 class="story-title" style="color:${s.color}">${s.title}</h2>
        <div class="verse-box">
          ${leftVersesHtml}
        </div>
      </div>
      <div class="page">
        <div class="page-header">
          <span class="story-badge" style="background:${s.color}">🎨 Ilustración Animada</span>
          <span class="page-num">Pág. ${pageRightNum}</span>
        </div>
        ${rightContentHtml}
      </div>
    </div>
  `;

  initCanvasAnimation(s.scene);
}

// Interactive Canvas Animations for each story
function spawnMagicBurst(e) {
  const rect = e.currentTarget.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  const colors = ['#ff6b81', '#feca57', '#1dd1a1', '#54a0ff', '#ff9ff3', '#ff9f43'];
  for (let i = 0; i < 18; i++) {
    const angle = (Math.PI * 2 * i) / 18;
    const speed = 2 + Math.random() * 4;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size: 6 + Math.random() * 7,
      color: colors[Math.floor(Math.random() * colors.length)],
      life: 1.0
    });
  }
}

function drawButterfly(ctx, x, y, scale, wingColor, bodyColor, t, phase) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);
  const flap = Math.sin(t * 7 + phase) * 0.35 + 0.75;

  // Wings (inspired by children's hand-drawn rounded wings & curly antennae)
  ctx.fillStyle = wingColor;
  ctx.strokeStyle = '#4a4a4a';
  ctx.lineWidth = 2.5;

  // Left wings
  ctx.save();
  ctx.scale(flap, 1);
  ctx.beginPath();
  ctx.ellipse(-26, -12, 26, 20, -0.3, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();
  ctx.beginPath();
  ctx.ellipse(-22, 16, 20, 16, 0.3, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();
  ctx.restore();

  // Right wings
  ctx.save();
  ctx.scale(flap, 1);
  ctx.beginPath();
  ctx.ellipse(26, -12, 26, 20, 0.3, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();
  ctx.beginPath();
  ctx.ellipse(22, 16, 20, 16, -0.3, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();
  ctx.restore();

  // Body
  ctx.fillStyle = bodyColor;
  ctx.beginPath();
  ctx.ellipse(0, 8, 8, 22, 0, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();

  // Head
  ctx.fillStyle = '#ffeaa7';
  ctx.beginPath();
  ctx.arc(0, -18, 13, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();

  // Curly antennae (from students' drawing)
  ctx.beginPath();
  ctx.moveTo(-5, -30);
  ctx.bezierCurveTo(-12, -48, -22, -42, -14, -35);
  ctx.moveTo(5, -30);
  ctx.bezierCurveTo(12, -48, 22, -42, 14, -35);
  ctx.stroke();

  // Happy eyes & smile
  ctx.fillStyle = '#2d3436';
  ctx.beginPath();
  ctx.arc(-4, -20, 2.2, 0, Math.PI * 2);
  ctx.arc(4, -20, 2.2, 0, Math.PI * 2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(0, -15, 5, 0.1 * Math.PI, 0.9 * Math.PI);
  ctx.stroke();

  ctx.restore();
}

function drawFlower(ctx, x, y, petalColor, t, phase) {
  ctx.save();
  ctx.translate(x, y);
  const sway = Math.sin(t * 2.5 + phase) * 0.08;
  ctx.rotate(sway);

  // Stem
  ctx.strokeStyle = '#2ed573';
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(0, 65);
  ctx.stroke();

  // Petals
  ctx.fillStyle = petalColor;
  ctx.strokeStyle = '#4a4a4a';
  ctx.lineWidth = 2;
  for (let i = 0; i < 8; i++) {
    ctx.save();
    ctx.rotate((Math.PI * 2 * i) / 8);
    ctx.beginPath();
    ctx.ellipse(0, -16, 8, 12, 0, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  // Center
  ctx.fillStyle = '#ffd32a';
  ctx.beginPath();
  ctx.arc(0, 0, 11, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();

  ctx.restore();
}

function initCanvasAnimation(scene) {
  const canvas = document.getElementById('sceneCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  particles = [];

  function resize() {
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
  }
  resize();

  let startTime = performance.now();

  function render(now) {
    const t = (now - startTime) / 1000;
    const w = canvas.width;
    const h = canvas.height;

    ctx.clearRect(0, 0, w, h);

    if (scene === 'isa_garden' || scene === 'isa_dance') {
      // Bright sunny sky & green meadow
      const sky = ctx.createLinearGradient(0, 0, 0, h);
      sky.addColorStop(0, '#70a1ff');
      sky.addColorStop(0.7, '#dff9fb');
      sky.addColorStop(1, '#7bed9f');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, w, h);

      // Sun
      ctx.fillStyle = '#ffd32a';
      ctx.beginPath();
      ctx.arc(w - 65, 65, 36 + Math.sin(t * 3) * 3, 0, Math.PI * 2);
      ctx.fill();

      // Meadow
      ctx.fillStyle = '#2ed573';
      ctx.beginPath();
      ctx.ellipse(w / 2, h + 30, w * 0.75, 110, 0, 0, Math.PI * 2);
      ctx.fill();

      // Hand-drawn style flowers
      drawFlower(ctx, w * 0.2, h - 75, '#ff9ff3', t, 0);
      drawFlower(ctx, w * 0.5, h - 85, '#ff6b81', t, 1.5);
      drawFlower(ctx, w * 0.8, h - 70, '#54a0ff', t, 3);

      // Isa & butterfly friends
      const bounce = scene === 'isa_dance' ? Math.abs(Math.sin(t * 5)) * 25 : Math.sin(t * 2.5) * 15;
      drawButterfly(ctx, w * 0.5 + Math.cos(t * 1.5) * 35, h * 0.42 - bounce, 1.25, '#ff9ff3', '#ff6b81', t, 0);
      drawButterfly(ctx, w * 0.24 + Math.sin(t * 2) * 20, h * 0.28 + Math.cos(t * 2) * 12, 0.75, '#70a1ff', '#1e90ff', t, 1);
      drawButterfly(ctx, w * 0.76 + Math.cos(t * 1.8) * 20, h * 0.32 + Math.sin(t * 2.2) * 12, 0.8, '#feca57', '#ff9f43', t, 2);
    } else if (scene === 'dylan_school' || scene === 'dylan_love') {
      // Classroom & learning magic
      ctx.fillStyle = '#dff9fb';
      ctx.fillRect(0, 0, w, h);

      // Chalkboard
      ctx.fillStyle = '#1e824c';
      ctx.strokeStyle = '#d35400';
      ctx.lineWidth = 8;
      ctx.fillRect(30, 30, w - 60, h * 0.55);
      ctx.strokeRect(30, 30, w - 60, h * 0.55);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 22px Fredoka, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('2 + 2 = 4   📖   A B C', w / 2, 75);
      ctx.font = 'bold 18px Nunito, sans-serif';
      ctx.fillText(scene === 'dylan_love' ? '❤️ ¡Con amor y dulzura! ❤️' : '⭐ ¡Estudiar es mi misión! ⭐', w / 2, 115);

      // Floating numbers & musical notes
      const symbols = ['1', '2', '3', '🎵', '📖', '⭐', '❤️'];
      symbols.forEach((sym, i) => {
        const sx = (w * (i + 1)) / (symbols.length + 1);
        const sy = h * 0.72 + Math.sin(t * 3 + i) * 18;
        ctx.font = '28px Fredoka, sans-serif';
        ctx.fillText(sym, sx, sy);
      });
    } else if (scene === 'escuela_amigos' || scene === 'escuela_baile') {
      // Sunny playground with Jarlan, Santiago & Seño Mary
      const bg = ctx.createLinearGradient(0, 0, 0, h);
      bg.addColorStop(0, '#48dbfb');
      bg.addColorStop(1, '#1dd1a1');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, w, h);

      // Rainbow arc
      const rColors = ['#ff6b6b', '#feca57', '#1dd1a1', '#54a0ff', '#a55eea'];
      rColors.forEach((c, idx) => {
        ctx.strokeStyle = c;
        ctx.lineWidth = 10;
        ctx.beginPath();
        ctx.arc(w / 2, h * 0.85, w * 0.42 - idx * 10, Math.PI, Math.PI * 2);
        ctx.stroke();
      });

      // Three happy friend characters jumping
      const friends = [
        { name: 'Jarlan', color: '#ff9f43', x: w * 0.25 },
        { name: 'Hemac', color: '#54a0ff', x: w * 0.5 },
        { name: 'Santiago', color: '#ff6b81', x: w * 0.75 }
      ];
      friends.forEach((f, idx) => {
        const jump = Math.abs(Math.sin(t * 4 + idx)) * 22;
        const fy = h * 0.68 - jump;
        ctx.fillStyle = f.color;
        ctx.beginPath();
        ctx.arc(f.x, fy, 24, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffeaa7';
        ctx.beginPath();
        ctx.arc(f.x, fy - 32, 16, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#2d3436';
        ctx.font = 'bold 14px Fredoka, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(f.name, f.x, fy + 42);
      });
    } else if (scene === 'julieta_castillo' || scene === 'julieta_familia') {
      // Golden Royal Castle
      const sky = ctx.createLinearGradient(0, 0, 0, h);
      sky.addColorStop(0, '#a55eea');
      sky.addColorStop(1, '#ff9ff3');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, w, h);

      // Golden Castle Towers
      ctx.fillStyle = '#ffd32a';
      ctx.strokeStyle = '#e67e22';
      ctx.lineWidth = 3;
      const cx = w / 2;
      const cy = h * 0.68;

      ctx.fillRect(cx - 75, cy - 80, 150, 110);
      ctx.strokeRect(cx - 75, cy - 80, 150, 110);

      // Left & Right towers
      ctx.fillRect(cx - 105, cy - 110, 40, 140);
      ctx.strokeRect(cx - 105, cy - 110, 40, 140);
      ctx.fillRect(cx + 65, cy - 110, 40, 140);
      ctx.strokeRect(cx + 65, cy - 110, 40, 140);

      // Roofs
      ctx.fillStyle = '#ff6b81';
      [cx - 85, cx, cx + 85].forEach((rx, i) => {
        const topY = i === 1 ? cy - 140 : cy - 155;
        const baseY = i === 1 ? cy - 80 : cy - 110;
        ctx.beginPath();
        ctx.moveTo(rx - 28, baseY);
        ctx.lineTo(rx, topY);
        ctx.lineTo(rx + 28, baseY);
        ctx.closePath();
        ctx.fill(); ctx.stroke();
      });

      // Floating golden hearts
      for (let i = 0; i < 6; i++) {
        const hx = w * 0.2 + i * (w * 0.12);
        const hy = h * 0.24 + Math.sin(t * 2.5 + i) * 16;
        ctx.font = '26px sans-serif';
        ctx.fillText('💛', hx, hy);
      }
    } else if (scene === 'musical_fiesta') {
      // Musical celebration with all characters
      const bg = ctx.createLinearGradient(0, 0, 0, h);
      bg.addColorStop(0, '#ff4757');
      bg.addColorStop(0.5, '#ffa502');
      bg.addColorStop(1, '#2ed573');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, w, h);

      drawButterfly(ctx, w * 0.5, h * 0.45 + Math.sin(t * 4) * 18, 1.3, '#ff9ff3', '#ff6b81', t, 0);

      const notes = ['🎵', '🎶', '🎸', '🎹', '⭐', '🦋', '💖'];
      notes.forEach((n, idx) => {
        const angle = t * 1.4 + (idx * Math.PI * 2) / notes.length;
        const nx = w / 2 + Math.cos(angle) * (w * 0.32);
        const ny = h / 2 + Math.sin(angle) * (h * 0.28);
        ctx.font = '32px sans-serif';
        ctx.fillText(n, nx - 16, ny + 10);
      });
    }

    // Render interactive burst particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life -= 0.025;
      if (p.life <= 0) {
        particles.splice(i, 1);
        continue;
      }
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    animFrameId = requestAnimationFrame(render);
  }

  animFrameId = requestAnimationFrame(render);
}

// Download self-contained HTML file
function downloadBook() {
  const fullHtml = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  const blob = new Blob([fullHtml], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'Nuestros_Cuentos_Magicos_Animado_3D.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Keyboard arrow navigation
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') nextSpread();
  if (e.key === 'ArrowLeft') prevSpread();
});

// Initialize on load
renderSpread();
</script>
